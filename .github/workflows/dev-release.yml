name: Development Release

on:
  push:
    branches: [ dev ]

permissions:
  contents: write

jobs:
  dev-release:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./nfqcooldown

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: nfqcooldown-linux-amd64
          - goos: linux
            goarch: arm64
            name: nfqcooldown-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: |
          mkdir -p dist
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -o dist/${{ matrix.name }} ./cmd/nfqcooldown

      - name: Package
        run: |
          cd dist
          tar -czf ${{ matrix.name }}.tar.gz ${{ matrix.name }}

      - name: Upload dev release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: Development Build
          body: |
            Automatic development build from the `dev` branch.

            This release is intended for testing only.
          prerelease: true
          make_latest: false
          files: nfqcooldown/dist/${{ matrix.name }}.tar.gz
