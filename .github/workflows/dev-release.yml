name: Development Release

on:
  push:
    branches: [ dev ]

permissions:
  contents: write

jobs:
  dev-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: nfqcooldown/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build binaries
        run: |
          mkdir -p dist

          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -o dist/nfqcooldown-linux-amd64 ./cmd/nfqcooldown

          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 \
            go build -o dist/nfqcooldown-linux-arm64 ./cmd/nfqcooldown

      - name: Package binaries
        run: |
          cd dist
          tar -czf nfqcooldown-linux-amd64.tar.gz nfqcooldown-linux-amd64
          tar -czf nfqcooldown-linux-arm64.tar.gz nfqcooldown-linux-arm64

      - name: Delete old dev release
        continue-on-error: true
        run: |
          gh release delete dev-latest --yes
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create or update dev-latest tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -f dev-latest
          git push -f origin dev-latest

      - name: Upload dev release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: Development Build
          body: |
            Automatic development build from the `dev` branch.

            This release is intended for testing only.
          prerelease: true
          make_latest: false
          files: |
            dist/nfqcooldown-linux-amd64.tar.gz
            dist/nfqcooldown-linux-arm64.tar.gz
